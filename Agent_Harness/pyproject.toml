[project]
name = "agent-harness"
version = "0.1.0"
description = "Harness cho agent tool-calling: LLM điều khiển, harness kiểm soát"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore:The default value of `allowed_objects`:Warning",
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Docstring ở project này dài có chủ ý: chúng ghi lại *vì sao* của từng quyết định,
# gồm cả các hành vi đã đo được của LangGraph và SQLite.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E402"]
